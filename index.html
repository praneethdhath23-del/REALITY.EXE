if(rainOn){const a=rain.geometry.attributes.position;for(let i=0;i<2500;i++){let y=a.array[i*3+1]-55*wd;if(y<0)y+=50;a.array[i*3+1]=y}a.needsUpdate=true;rain.position.set(P.x,0,P.z)}
tl.intensity=1.2+Math.sin(tm*3)*.4}
function update(dt){
const sp=sprint||keys.ShiftLeft?11:6.5;let f=-jv.y+(keys.KeyW|keys.ArrowUp)-(keys.KeyS|keys.ArrowDown),r=jv.x+(keys.KeyD|keys.ArrowRight)-(keys.KeyA|keys.ArrowLeft);const l=Math.hypot(f,r);if(l>1){f/=l;r/=l}
const sy=Math.sin(yaw),cy=Math.cos(yaw),vx=-sy*f+cy*r,vz=-cy*f-sy*r;P.x+=vx*sp*dt;P.z+=vz*sp*dt;if(l>.1)heading=Math.atan2(vx,vz);
P.vy+=(gr?-30:30)*dt;P.y+=P.vy*dt;
if(gr&&P.y<=0){P.y=0;P.vy=0;grounded=true}
if(!gr&&P.y>=CEIL){P.y=CEIL;P.vy=0;grounded=true}
if(!gr&&P.y<CEIL-1)grounded=false;
collide(P,.6,iv?CEIL-2:P.y);
pg.position.set(P.x,P.y,P.z);let dr=heading-pg.rotation.y;dr=Math.atan2(Math.sin(dr),Math.cos(dr));pg.rotation.y+=dr*Math.min(1,dt*12);pg.rotation.x+=((iv?Math.PI:0)-pg.rotation.x)*Math.min(1,dt*6);
roll+=((iv?Math.PI:0)-roll)*Math.min(1,dt*4);const sg=Math.cos(roll);cam.up.set(Math.sin(roll),sg,0);
const hy=P.y+(iv?-1.2:1.2),dist=9,cp=Math.cos(pitch);cam.position.set(P.x+Math.sin(yaw)*cp*dist,hy+sg*(Math.sin(pitch)*dist+1),P.z+Math.cos(yaw)*cp*dist);cam.lookAt(P.x,hy,P.z);
en=Math.min(100,en+6*dt);
frs.forEach((fr,i)=>{if(fr.visible&&Math.hypot(fr.position.x-P.x,fr.position.z-P.z)<2.5&&Math.abs(P.y)<4){fr.visible=false;S.frag[i]=1;toast('CODE FRAGMENT '+cnt()+'/3 RECOVERED');save()}});
if(EN.on){const ed=dt*ts,ep=eg.position,dx=P.x-ep.x,dz=P.z-ep.z,d=Math.hypot(dx,dz);
if(EN.fl&&!S.down){ep.y+=(5-ep.y)*Math.min(1,dt*3);eg.rotation.y+=dt}else{ep.y+=(0-ep.y)*Math.min(1,dt*6);
if(!S.down&&d<28&&d>1.8){const spd=4-Math.min(S.deaths,3)*.6;ep.x+=dx/d*spd*ed;ep.z+=dz/d*spd*ed;collide(ep,1.2,0);eg.rotation.y=Math.atan2(dx,dz)}
if(!S.down&&d<2.4&&Math.abs(P.y-ep.y)<3.5)hp-=25*ed}
if(S.down&&d<30&&d>3){ep.x+=dx/d*3*ed;ep.z+=dz/d*3*ed;collide(ep,1.2,0)}
if(hp<=0)respawn()}
if(EN.on&&stepN()===3&&Math.hypot(P.x,P.z+126)<4)ending();
as+=dt;if(as>5){as=0;save()}
$('hp').style.width=hp+'%';$('en').style.width=en+'%';$('mt').textContent=misText();mini()}
function ending(){mode='end';S.end=1;save();$('hud').style.display='none';$('end').style.display='flex';$('et').innerHTML='<h1 style="font-size:28px">CORE TERMINAL</h1><p>The simulation waits for your decision.</p><button id="e1">REWRITE THE WORLD</button><button id="e2" style="margin-top:8px">PRESERVE THE SIMULATION</button>';
const fin=t=>{$('et').innerHTML='<p>'+t+'</p><p style="color:#a5f">CHAPTER 1 COMPLETE</p><button id="e3">MAIN MENU</button>';$('e3').onclick=toMenu};
$('e1').onclick=()=>fin('You overwrite the Core. The city dissolves into raw code, free to become anything.');$('e2').onclick=()=>fin('You seal the glitch. Neo-City endures, unaware of what lies beneath its sky.')}
function toMenu(){save();mode='menu';$('hud').style.display='none';$('end').style.display='none';$('intro').style.display='none';$('menu').style.display='flex';$('mC').style.display=loadS()?'block':'none'}
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1e3);last=now;if(!S)S=fresh();world(dt);
if(mode==='play')update(dt);else{if(mode!=='end'||true){cam.up.set(0,1,0);cam.position.set(Math.cos(now/7000)*70,26,Math.sin(now/7000)*70);cam.lookAt(0,16,0)}}
R.render(scene,cam)}
// flow
function begin(free){EN.on=!free;if(!S||free===undefined)S=S||fresh();applyAll();$('menu').style.display='none';$('hud').style.display='block';mode='play';selUI();toast(free?'FREE EXPLORATION':'CHAPTER 1 : THE DISCOVERY')}
function play(free,loaded){S=loaded||fresh();if(free)S=fresh();EN.on=!free;if(!loaded&&!free){$('menu').style.display='none';$('intro').style.display='flex';mode='intro';const L=['> BOOT SEQUENCE ...','> SIMULATION INTEGRITY: 99.97%','> ANOMALY DETECTED: NEO-CITY','> A glitch ripples across the sky...','> REALITY ENGINE: ONLINE'];let i=0,done=false;$('il').innerHTML='';const fin=()=>{if(done)return;done=true;$('intro').style.display='none';begin(false)};$('intro').onclick=fin;(function nx(){if(done)return;if(i<L.length){$('il').innerHTML+=L[i++]+'<br>';setTimeout(nx,900)}else setTimeout(fin,600)})()}else begin(free)}
$('mN').onclick=()=>play(false,null);$('mF').onclick=()=>play(true,null);$('mC').onclick=()=>{const s=loadS();if(s)play(false,s)};
$('qbtn').onclick=()=>{Q=(Q+1)%4;setQ()};$('menuBtn').onclick=toMenu;
$('mC').style.display=loadS()?'block':'none';
setQ();requestAnimationFrame(loop);
</script></body></html>
